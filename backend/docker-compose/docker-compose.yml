services:
  postgres:
    image: postgres:17
    container_name: torneos-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: torneos_db
    ports:
      - "5432:5432"
    volumes:
      - torneos_data:/var/lib/postgresql/data
      - ../src/db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

volumes:
  torneos_data:
